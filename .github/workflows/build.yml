name: Build

on:
  workflow_dispatch:
  push:
  pull_request:
  release:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target_os: linux
            target_platform: linux_amd64

          - os: ubuntu-24.04-arm
            target_os: linux
            target_platform: linux_arm64

          - os: ubuntu-latest
            target_os: linux
            target_platform: linux_i386

          - os: windows-latest
            msvc_arch: x64
            target_os: windows
            target_platform: win64_msvc16

          - os: windows-11-arm
            msvc_arch: arm64
            target_os: windows
            target_platform: winarm64_msvc16

          - os: windows-latest
            msvc_arch: x86
            target_os: windows
            target_platform: win32_msvc16

          - os: macos-latest
            target_os: macos
            target_platform: macos

          - os: ubuntu-latest
            target_os: wasm
            target_platform: webassembly

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@master

      - name: Setup windows
        if: matrix.target_os == 'windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Install linux libraries
        if: matrix.target_os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          libgl1-mesa-dev \
          libx11-dev \
          libxrandr-dev \
          libxi-dev \
          libxcursor-dev \
          libxinerama-dev

      - name: Setup wasm
        if: matrix.target_os == 'wasm'
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: 5.0.3
          actions-cache-folder: 'emsdk-cache'

      - name: Build
        run: make TARGET_OS=${{ matrix.target_os }} TARGET_PLATFORM=${{ matrix.target_platform }}
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: raygui-dev_${{ matrix.target_platform }}
          path: bin/${{ matrix.target_platform }}